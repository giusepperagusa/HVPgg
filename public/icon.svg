<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="suseGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30BA78" />
      <stop offset="100%" stop-color="#027A48" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#30BA78" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#30BA78" stroke-width="4" stroke-opacity="0.4" />
  <g transform="translate(64, 64)" filter="url(#glow)">
    <!-- Edge Cluster Hexagon Pattern -->
    <path d="M192 32 L336 115 L336 281 L192 364 L48 281 L48 115 Z" fill="none" stroke="url(#suseGreen)" stroke-width="16" stroke-linejoin="round" />
    <!-- Center Node / Chameleon Eye & Processor Core -->
    <circle cx="192" cy="198" r="54" fill="url(#suseGreen)" />
    <circle cx="192" cy="198" r="24" fill="#020617" />
    <circle cx="204" cy="188" r="8" fill="#ffffff" />
    <!-- Three Edge Nodes (Master + 2 Workers) connecting -->
    <circle cx="192" cy="32" r="20" fill="#30BA78" />
    <circle cx="336" cy="281" r="20" fill="#30BA78" />
    <circle cx="48" cy="281" r="20" fill="#30BA78" />
    <!-- Interconnect traces -->
    <line x1="192" y1="52" x2="192" y2="144" stroke="#30BA78" stroke-width="8" stroke-dasharray="8 6" />
    <line x1="320" y1="268" x2="238" y2="225" stroke="#30BA78" stroke-width="8" stroke-dasharray="8 6" />
    <line x1="64" y1="268" x2="146" y2="225" stroke="#30BA78" stroke-width="8" stroke-dasharray="8 6" />
  </g>
</svg>
